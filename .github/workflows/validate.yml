name: Validate research reports
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example report
        run: python tools/validate_report.py examples/host-playback.json
      - name: Synthetic playback metrics
        run: python tools/analyze_playback.py examples/playback-measurements.json
      - name: Synthetic browser lifecycle
        run: python tools/browser_lifecycle.py examples/browser-lifecycle.json
